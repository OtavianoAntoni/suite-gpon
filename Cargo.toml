[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/transport",
    "crates/mock-ne-huawei",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

# Metas de tamanho da SPEC (§7.3): binário < 20 MB. Estas opções são as que
# compram isso sem truque — sem elas a meta não se sustenta.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
