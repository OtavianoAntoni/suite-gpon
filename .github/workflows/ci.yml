name: ci

# Gate do repositório: os mesmos comandos que rodam na máquina do dev.
# O lint anti-animação entra pelo `npm run build` da UI — se alguém animar a interface,
# o build falha aqui e não chega a empacotar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (domínio + transporte + contrato)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema do Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            build-essential curl wget file libssl-dev libxdo-dev \
            libayatana-appindicator3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # -j 4: build do Tauri é pesado; paralelismo alto já derrubou máquina de dev.
      - name: cargo test
        run: cargo test --workspace -j 4

  ui:
    name: UI (lint de animação + build estático)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 26 = mesma major usada no desenvolvimento (npm 11). Antes estava 22 (npm 10) e o
          # `npm ci` recusava o lock gerado pelo npm 11 com "package.json and package-lock.json
          # are not in sync". O ui/.npmrc tem engine-strict=true, então divergência quebra o job.
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      # `npm run build` = lint:no-anim && vite build -> é aqui que a UI flat é garantida.
      - name: build (inclui o lint anti-animação)
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui/build
          retention-days: 7

  windows:
    name: Windows (.exe real, medido)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      # O mesmo conjunto de testes, agora sob o alvo Windows (ABI diferente, paths diferentes).
      - name: cargo test (Windows)
        run: cargo test --workspace -j 4

      # `tauri build` é o único jeito de embutir o frontend (feature custom-protocol).
      - name: tauri build (release, assets embutidos)
        # SEMPRE da raiz do repo: a CLI procura `tauri.conf.json` a partir do cwd e ele vive
        # em src-tauri/. `npm --prefix ui run tauri` roda com cwd=ui e a CLI entra em pânico
        # ('Couldn't recognize the current folder as a Tauri project'). Chamar o entry point
        # pelo node evita depender de shim .cmd/.ps1 e mantém o cwd correto.
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build

      - name: medir o .exe (critério da spec — menos de 20 MB no Windows)
        shell: bash
        run: |
          EXE=target/release/suite-gpon.exe
          ls -l "$EXE"
          BYTES=$(stat -c%s "$EXE")
          MB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b/1048576 }')
          echo "TAMANHO_WINDOWS_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "TAMANHO_WINDOWS_MB=$MB" >> "$GITHUB_ENV"
          {
            echo "### .exe Windows medido"
            echo ""
            echo "| arquivo | bytes | MB |"
            echo "|---|---|---|"
            echo "| \`suite-gpon.exe\` | $BYTES | $MB |"
            echo ""
            echo "Meta da spec: < 20 MB. Este número é do ELF? **não** — é do PE, e é o único que vale para o item 19 da §12."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: suite-gpon-windows-exe
          path: target/release/suite-gpon.exe
          retention-days: 14
